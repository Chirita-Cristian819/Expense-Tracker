# Application
spring.application.name=Expense Tracker
application.host=http://localhost:8080

# Database
spring.datasource.url=jdbc:postgresql://ep-holy-frog-b2a1k49a-pooler.c-6.eu-central-1.aws.neon.tech:5432/ExpensesDatabase
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Swagger
springdoc.swagger-ui.csrf.enabled=true

# Session Cookies
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=10000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000

# IMAP
app.imap.host=imap.gmail.com
app.imap.port=993
app.imap.protocol=imaps
app.imap.username=${MAIL_USERNAME}
app.imap.password=${MAIL_PASSWORD}
app.imap.folder=INBOX
app.imap.processed-folder=Bounces/Processed
app.imap.subject=verify your pocket tracer account
app.imap.poll-interval=10s
spring.mail.properties[mail.imaps.connectiontimeout]=10000
spring.mail.properties[mail.imaps.timeout]=10000
spring.mail.properties[mail.imaps.writetimeout]=10000
spring.mail.properties[mail.imaps.ssl.checkserveridentity]=true